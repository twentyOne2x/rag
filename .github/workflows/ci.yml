name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IS_TESTING: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile sources (syntax check)
        run: python -m compileall -q src tests

      - name: Run tenant and query regression tests
        run: |
          python -m pytest -q \
            tests/test_tenancy_unittest.py \
            src/rag_v2/tests/test_query_engine_pipeline.py

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build application image
        run: docker build --file Dockerfile_app --tag icmfyi-rag:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' icmfyi-rag:ci)" = "icmfyi"
